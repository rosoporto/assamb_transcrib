[project]
name = "assemblyai-cli"
version = "0.2.1"
description = "CLI-транскрибатор на AssemblyAI: ссылка или файл на входе"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12,<1",
    "rich>=13,<16",
    "assemblyai>=1.10,<2",
    "httpx>=0.27,<1",
    "yt-dlp>=2025.1",
    "python-dotenv>=1,<2",
]

[project.scripts]
transcrib = "main:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["B008", "BLE001"]  # B008 — идиома Typer; BLE001 — широкий except на границе CLI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "RUF100", "I001"]  # в тестах путь к main добавляется до импорта

[tool.pytest.ini_options]
testpaths = ["tests"]
